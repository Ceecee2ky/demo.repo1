<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alac Stores - Login & Sign Up</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --error: #f72585;
            --gray: #6c757d;
            --border-radius: 8px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .logo-container {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            padding: 30px 20px;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.9;
        }

        .form-container {
            padding: 30px;
        }

        .form-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--dark);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.2);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-google {
            background-color: white;
            color: var(--dark);
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background-color: #f8f9fa;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #ddd;
        }

        .divider-text {
            padding: 0 15px;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--gray);
        }

        .form-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .form-link:hover {
            text-decoration: underline;
        }

        .message {
            padding: 10px 15px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .message-success {
            background-color: rgba(76, 201, 240, 0.2);
            color: #0a6c7e;
            border: 1px solid rgba(76, 201, 240, 0.5);
        }

        .message-error {
            background-color: rgba(247, 37, 133, 0.2);
            color: #a4133c;
            border: 1px solid rgba(247, 37, 133, 0.5);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .config-error {
            background-color: #fee;
            color: #c33;
            padding: 15px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #fcc;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo">ALAC STORES</div> 
             <div class="tagline">Your one-stop shopping destination</div> 
        </div>
        
        <div class="form-container">
            <!-- Configuration Error Message -->
            <div id="configError" class="config-error" style="display: none;">
                <strong>Firebase Configuration Required:</strong> Please replace the Firebase configuration with your actual project details.
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <h2 class="form-title">Welcome Back</h2>
                
                <div id="loginMessage" class="message"></div>
                
                <div class="form-group">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword" class="form-label">Password</label>
                    <div class="password-container">
                        <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" data-target="loginPassword">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                </button>
                
                <div class="divider">
                    <span class="divider-text">or</span>
                </div>
                
                <button type="button" id="googleLogin" class="btn btn-google">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                    </svg>
                    Continue with Google
                </button>
                
                <div class="form-footer">
                    Don't have an account? <a href="#" id="showSignup" class="form-link">Sign Up</a>
                </div>
            </form>
            
            <!-- Sign Up Form -->
            <form id="signupForm" class="auth-form" style="display: none;">
                <h2 class="form-title">Create Account</h2>
                
                <div id="signupMessage" class="message"></div>
                
                <div class="form-group">
                    <label for="signupName" class="form-label">Full Name</label>
                    <input type="text" id="signupName" class="form-input" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="signupEmail" class="form-label">Email</label>
                    <input type="email" id="signupEmail" class="form-input" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="signupPassword" class="form-label">Password</label>
                    <div class="password-container">
                        <input type="password" id="signupPassword" class="form-input" placeholder="Create a password" required>
                        <button type="button" class="toggle-password" data-target="signupPassword">👁️</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="signupBtn">
                    <span class="btn-text">Create Account</span>
                </button>
                
                <div class="divider">
                    <span class="divider-text">or</span>
                </div>
                
                <button type="button" id="googleSignup" class="btn btn-google">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                    </svg>
                    Continue with Google
                </button>
                
                <div class="form-footer">
                    Already have an account? <a href="#" id="showLogin" class="form-link">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Global auth variable
        let auth = null;

        // Initialize Firebase
        function initializeFirebase() {
            // === REPLACE THIS WITH YOUR ACTUAL FIREBASE CONFIG ===
            const firebaseConfig = {
                apiKey: "AIzaSyDvAxLoKWI_NKVXvtqAohXLqwq9FdEomJQ",
                authDomain: "alac-d3792.firebaseapp.com",
                projectId: "alac-d3792",
                storageBucket: "alac-d3792.firebasestorage.app",
                messagingSenderId: "560454700484",
                appId: "1:560454700484:web:16844cd244247b1d8ba891",
                measurementId: "G-60B72E8QCD"
            };
            // === END FIREBASE CONFIG ===
            

      
            // Check if config is still using placeholder values
            const configError = document.getElementById('configError');
            if (firebaseConfig.apiKey.includes("EXAMPLE") || 
                firebaseConfig.authDomain.includes("your-project-id") ||
                firebaseConfig.apiKey.includes("YOUR_API_KEY")) {
                
                console.error('❌ Please replace the Firebase configuration with your actual project details!');
                configError.style.display = 'block';
                return null;
            }

            try {
                // Initialize Firebase
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                console.log('✅ Firebase initialized successfully');
                configError.style.display = 'none';
                return auth;
            } catch (error) {
                console.error('❌ Firebase initialization error:', error);
                configError.innerHTML = `<strong>Firebase Error:</strong> ${error.message}`;
                configError.style.display = 'block';
                return null;
            }
        }

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const showSignup = document.getElementById('showSignup');
        const showLogin = document.getElementById('showLogin');
        const loginMessage = document.getElementById('loginMessage');
        const signupMessage = document.getElementById('signupMessage');
        const googleLogin = document.getElementById('googleLogin');
        const googleSignup = document.getElementById('googleSignup');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const togglePasswordButtons = document.querySelectorAll('.toggle-password');

        // Initialize Firebase when page loads
        document.addEventListener('DOMContentLoaded', function() {
            auth = initializeFirebase();
            
            if (!auth) {
                showMessage(loginMessage, 'Firebase not configured. Please check the configuration.', 'error');
                showMessage(signupMessage, 'Firebase not configured. Please check the configuration.', 'error');
            }
        });

        // Toggle between login and signup forms
        showSignup.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            clearMessages();
        });

        showLogin.addEventListener('click', (e) => {
            e.preventDefault();
            signupForm.style.display = 'none';
            loginForm.style.display = 'block';
            clearMessages();
        });

        // Toggle password visibility
        togglePasswordButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    button.textContent = '🙈';
                } else {
                    passwordInput.type = 'password';
                    button.textContent = '👁️';
                }
            });
        });

        // Clear all messages
        function clearMessages() {
            loginMessage.style.display = 'none';
            signupMessage.style.display = 'none';
        }

        // Show message
        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = `message message-${type}`;
            element.style.display = 'block';
        }

        // Show loading state
        function setLoading(button, isLoading) {
            const btnText = button.querySelector('.btn-text');
            if (isLoading) {
                btnText.textContent = 'Loading...';
                button.classList.add('loading');
            } else {
                if (button.id === 'loginBtn') {
                    btnText.textContent = 'Sign In';
                } else {
                    btnText.textContent = 'Create Account';
                }
                button.classList.remove('loading');
            }
        }

        // Check if Firebase is initialized
        function checkFirebaseInitialized() {
            if (!auth) {
                showMessage(loginMessage, 'Firebase is not initialized. Please check configuration.', 'error');
                showMessage(signupMessage, 'Firebase is not initialized. Please check configuration.', 'error');
                return false;
            }
            return true;
        }

        // Login with email and password
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!checkFirebaseInitialized()) return;
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage(loginMessage, 'Please fill in all fields', 'error');
                return;
            }

            setLoading(loginBtn, true);
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                showMessage(loginMessage, 'Login successful!', 'success');
                console.log('✅ User logged in:', userCredential.user);
                
            } catch (error) {
                console.error('Login error:', error);
                let errorMessage = 'An error occurred during login.';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'No account found with this email.';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'Incorrect password.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Invalid email address.';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = 'This account has been disabled.';
                        break;
                    default:
                        errorMessage = error.message;
                }
                
                showMessage(loginMessage, errorMessage, 'error');
            } finally {
                setLoading(loginBtn, false);
            }
        });

        // Sign up with email and password
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!checkFirebaseInitialized()) return;
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validate form
            if (!name || !email || !password || !confirmPassword) {
                showMessage(signupMessage, 'Please fill in all fields', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage(signupMessage, 'Passwords do not match.', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage(signupMessage, 'Password should be at least 6 characters.', 'error');
                return;
            }

            setLoading(signupBtn, true);
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Update profile with name
                await user.updateProfile({
                    displayName: name
                });
                
                showMessage(signupMessage, 'Account created successfully! You can now login.', 'success');
                console.log('✅ User created:', user);
                
                // Clear form
                signupForm.reset();
                
            } catch (error) {
                console.error('Signup error:', error);
                let errorMessage = 'An error occurred during sign up.';
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'An account with this email already exists.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Invalid email address.';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Password is too weak.';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'Email/password accounts are not enabled. Please check your Firebase configuration.';
                        break;
                    default:
                        errorMessage = error.message;
                }
                
                showMessage(signupMessage, errorMessage, 'error');
            } finally {
                setLoading(signupBtn, false);
            }
        });

        // Google authentication

async function signInWithGoogle() {
    if (!checkFirebaseInitialized()) return;
    
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        
        // Add scopes if needed (optional)
        // provider.addScope('email');
        // provider.addScope('profile');
        
        console.log('🔄 Starting Google authentication...');
        
        const result = await auth.signInWithPopup(provider);
        
        showMessage(
            loginForm.style.display !== 'none' ? loginMessage : signupMessage, 
            'Google authentication successful! Redirecting...', 
            'success'
        );
        
        console.log('✅ Google sign-in successful:', result.user);
        
        // Redirect to landing page after 1.5 seconds
        setTimeout(() => {
            window.location.href = 'alac.html';
        }, 1500);
        
    } catch (error) {
        console.error('❌ Google auth error details:', error);
        console.error('Error code:', error.code);
        console.error('Error message:', error.message);
        
        let errorMessage = 'Failed to authenticate with Google. Please try again.';
        
        // Specific error handling
        switch (error.code) {
            case 'auth/popup-blocked':
                errorMessage = 'Popup was blocked by your browser. Please allow popups for this site.';
                break;
            case 'auth/popup-closed-by-user':
                errorMessage = 'Sign-in was cancelled. Please try again.';
                break;
            case 'auth/unauthorized-domain':
                errorMessage = 'This domain is not authorized for Google sign-in. Please contact support.';
                break;
            case 'auth/operation-not-allowed':
                errorMessage = 'Google sign-in is not enabled. Please contact support.';
                break;
            case 'auth/network-request-failed':
                errorMessage = 'Network error. Please check your internet connection.';
                break;
        }
        
        showMessage(
            loginForm.style.display !== 'none' ? loginMessage : signupMessage, 
            errorMessage, 
            'error'
        );
    }
}
        // Add event listeners for Google authentication
        googleLogin.addEventListener('click', signInWithGoogle);
        googleSignup.addEventListener('click', signInWithGoogle);

        // Monitor auth state changes
        if (auth) {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    console.log('👤 User is signed in:', user.email);
                } else {
                    console.log('👤 No user signed in');
                }
            });
        }

        showMessage(loginMessage, 'Please fill in all fields', 'error');

    }

    setLoading(loginBtn, true);
    
    try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        showMessage(loginMessage, 'Login successful! Redirecting...', 'success');

    </script>
</body>
